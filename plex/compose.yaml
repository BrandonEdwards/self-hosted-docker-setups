version: "2.1"
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    #image: plexinc/pms-docker
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=${CLAIM}
    volumes:
      - ./config:/config
      - /mnt/TV:/tv
      - /mnt/Movies:/movies
    #devices:
    # - /dev/dri:/dev/dri
    restart: unless-stopped
